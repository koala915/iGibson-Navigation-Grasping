[Service]
# G2: the grasp service also drives the wheels over TCP 7000 (grasp/v23/chassis_server.py),
# so approach -> grasp -> drive away needs no restart. Remove this file to get the
# arm-only service back; x3plus-navigation stays the maintenance path either way.
Environment=GRASP_SERVICE_CHASSIS_PORT=7000
# G2 step 3: the serial owner publishes the wheel odometry (grasp/v23/odom_bridge.py).
# rosbridge may start after the service; publishing begins when it is up.
Environment=GRASP_SERVICE_ODOM_ROSBRIDGE=127.0.0.1:9090
