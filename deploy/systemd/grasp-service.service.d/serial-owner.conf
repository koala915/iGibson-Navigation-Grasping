[Unit]
# The resident grasp service and the navigation motor server both open the
# Rosmaster board. Keep an explicit ordering edge as well as the conflict:
# when one ordered unit is stopped while the other starts, systemd completes
# the stop job first. This is the same ordering declared by navigation's
# "After=grasp-service.service", repeated here so the safety rule is visible
# and survives installing this drop-in on its own.
Before=x3plus-navigation.service
Conflicts=x3plus-navigation.service

[Service]
# Fail closed if a process outside these systemd units still owns the UART.
# The ordered navigation stop completes before these checks are executed.
ExecStartPre=/usr/bin/test -e /dev/myserial
ExecStartPre=+/usr/local/libexec/x3plus/check-serial-owner.sh /dev/myserial
