[Service]
# Two runtime additions for the approach -> E1 grasp flow (2026-10-16):
#
# --allow-top-clipped-grasp-home: the restricted exception from grasp/v23/README.md.
#   A box touching ONLY the top edge passes; left/right/bottom clipping and the
#   calibration hull and policy-range checks still fail closed.
# --frame-report: every frame, write what E1 saw to tmpfs, rejected boxes included,
#   with a rough floor position. integration/sugarbox_approach_grasp.py reads it to
#   drive forward/back a few cm (arm in travel) when the parked box sits outside the
#   E1 grasp band, then measures again. The report is never a grasp target.
#
# Delete this file (then daemon-reload) to get the plain bridge back.
ExecStart=
ExecStart=/home/jetson/grasp_venv/bin/python3 -u /home/jetson/Documents/deploy_jetson2/integration/vision_grasp_bridge.py --host 127.0.0.1 --port 5555 --model /home/jetson/Documents/deploy_jetson2/detection/models/best.pt --stream /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0 --class-height sugarbox=0.065 --pose v23_e1_grasp_home --policy-x-range 0.205 0.280 --policy-y-range -0.070 0.065 --homography /home/jetson/Documents/deploy_jetson2/integration/grasp_home_homography_e1.json --grasp-forward-offset-mm 5.0 --imgsz 320 --rate 1.0 --allow-top-clipped-grasp-home --frame-report /dev/shm/grasp_vision_frame.json
